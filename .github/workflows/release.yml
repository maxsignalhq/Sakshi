name: Release

# Pushing a tag like v0.1.0 builds every platform, then publishes a GitHub
# release with the archives, SHA256SUMS and rendered package manifests, then
# pushes the Homebrew formula and Scoop manifest to their own repositories.
# Pull requests that touch this file or packaging/ run the build and package
# steps only, so changes here are tested without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p sakshi --target ${{ matrix.target }}

      # The Intel macOS binary is cross-compiled on an Apple Silicon runner and
      # cannot be run there, so it is the one build not smoke-tested.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/sakshi --version

      - name: Name the archive
        id: name
        shell: bash
        run: |
          version="v0.0.0-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; fi
          echo "name=sakshi-${version}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${{ steps.name.outputs.name }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/sakshi" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ steps.name.outputs.name }}"
          # LICENSE and README.md are already here; only the binary needs copying.
          Copy-Item "target/${{ matrix.target }}/release/sakshi.exe" -Destination .
          Compress-Archive -Path sakshi.exe, LICENSE, README.md -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            sakshi-*.tar.gz
            sakshi-*.zip
            sakshi-*.sha256
          if-no-files-found: error

  packaging:
    name: package manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s packaging -v

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Checksums and manifests
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          cd ..
          python3 packaging/render.py --version "${GITHUB_REF_NAME#v}" --sums dist/SHA256SUMS --out dist/manifests
          (cd dist && zip -qr package-manifests.zip manifests && rm -r manifests)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS

      # install.sh and install.ps1 fetch `<archive>.sha256` next to each
      # archive. Fail loudly here if the release ever lacks one, rather than
      # shipping installers that 404.
      - name: Check every archive has its checksum file on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          missing=0
          for archive in $(echo "$assets" | grep -E '[.](tar[.]gz|zip)$' | grep -v '^package-manifests'); do
            if ! echo "$assets" | grep -qx "$archive.sha256"; then
              echo "missing checksum file for $archive" >&2
              missing=1
            fi
          done
          exit $missing

  # Pushes the freshly rendered Homebrew formula and Scoop manifest to their
  # own repositories. It runs after the release exists, as a separate job, so a
  # failure here never undoes or blocks the release itself; re-run the job (or
  # follow docs/RELEASING.md by hand) to retry. Each repository has its own
  # write-enabled deploy key, whose private half is the Actions secret
  # TAP_DEPLOY_KEY or BUCKET_DEPLOY_KEY. A key can push to its one repository
  # and nothing else. Without the secrets the job reports that and succeeds,
  # leaving the manual steps.
  package-repos:
    name: update tap and bucket
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      BUCKET_DEPLOY_KEY: ${{ secrets.BUCKET_DEPLOY_KEY }}
    steps:
      - name: Check for the deploy keys
        id: keys
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ] || [ -z "$BUCKET_DEPLOY_KEY" ]; then
            echo "::notice::TAP_DEPLOY_KEY or BUCKET_DEPLOY_KEY is not set; skipping the tap and bucket update. Follow docs/RELEASING.md section 3 by hand."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the rendered manifests from the release
        if: steps.keys.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern package-manifests.zip
          unzip -q package-manifests.zip
          test -f manifests/homebrew/sakshi.rb
          test -f manifests/scoop/sakshi.json

      - uses: actions/checkout@v4
        if: steps.keys.outputs.present == 'true'
        with:
          repository: maxsignalhq/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - uses: actions/checkout@v4
        if: steps.keys.outputs.present == 'true'
        with:
          repository: maxsignalhq/scoop-bucket
          ssh-key: ${{ secrets.BUCKET_DEPLOY_KEY }}
          path: bucket

      - name: Update the Homebrew tap
        if: steps.keys.outputs.present == 'true'
        run: |
          mkdir -p tap/Formula
          cp manifests/homebrew/sakshi.rb tap/Formula/sakshi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sakshi.rb
          if git diff --cached --quiet; then
            echo "tap already up to date"
          else
            git commit -m "sakshi ${GITHUB_REF_NAME#v}"
            git push origin HEAD
          fi

      - name: Update the Scoop bucket
        if: steps.keys.outputs.present == 'true'
        run: |
          mkdir -p bucket/bucket
          cp manifests/scoop/sakshi.json bucket/bucket/sakshi.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/sakshi.json
          if git diff --cached --quiet; then
            echo "bucket already up to date"
          else
            git commit -m "sakshi ${GITHUB_REF_NAME#v}"
            git push origin HEAD
          fi
