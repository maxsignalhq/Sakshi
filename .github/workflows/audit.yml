name: Audit

on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
