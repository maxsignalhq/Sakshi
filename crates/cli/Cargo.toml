[package]
name = "sakshi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The witness for your AI coding agents"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
sakshi-adapters = { path = "../adapters" }
sakshi-core = { path = "../core" }
sakshi-git = { path = "../git" }
sakshi-ipc = { path = "../ipc" }
sakshi-store = { path = "../store" }
sakshi-tui = { path = "../tui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
time = "0.3"
sakshi-pty = { path = "../pty" }
tokio = { version = "1.53.3", features = ["rt", "macros", "time"] }
vt100 = "0.18"

[lints]
workspace = true
